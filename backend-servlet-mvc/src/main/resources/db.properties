# ──────────────────────────────────────────────
# GreenWear DB 연결 설정
# 환경변수가 있으면 환경변수가 우선됩니다.
# ──────────────────────────────────────────────

# JDBC Driver
db.driver=com.mysql.cj.jdbc.Driver

# DB URL (Docker 컨테이너 내에서는 host=db, 로컬 개발은 localhost)
db.url=jdbc:mysql://localhost:3306/greenwear_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true

# 계정 정보
db.username=greenwear_user
db.password=greenwear_password

# ──────────────── HikariCP 풀 설정 ────────────────
# 최소 유휴 커넥션 수
hikari.minimumIdle=3

# 최대 커넥션 수
hikari.maximumPoolSize=10

# 커넥션 유지 시간 (ms) - 30분
hikari.connectionTimeout=30000

# 유휴 커넥션 타임아웃 (ms) - 10분
hikari.idleTimeout=600000

# 커넥션 최대 수명 (ms) - 30분
hikari.maxLifetime=1800000

# 커넥션 유효성 확인 쿼리
hikari.connectionTestQuery=SELECT 1
