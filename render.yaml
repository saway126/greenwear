# Render.com 배포 설정 (무료 플랜)
# https://render.com 에서 "New > Blueprint" 로 이 파일 연결

services:
  # ── Node.js 백엔드 ──────────────────────────────────────────
  - type: web
    name: greenwear-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # DB_TYPE: postgres (Render PostgreSQL 사용)
      - key: DB_TYPE
        value: postgres
      # 아래 DB 변수들은 Render PostgreSQL 서비스에서 자동 주입됩니다
      - key: DB_HOST
        fromDatabase:
          name: greenwear-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: greenwear-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: greenwear-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: greenwear-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: greenwear-db
          property: database
      - key: DB_SSL
        value: "true"
      # 프론트엔드 CORS (Vercel 배포 후 주소로 변경)
      - key: ALLOWED_ORIGINS
        value: "https://greenwear-demo.vercel.app,http://localhost:5173"

databases:
  # ── PostgreSQL (Render 무료 90일) ──────────────────────────
  - name: greenwear-db
    databaseName: greenwear_db
    user: greenwear_user
    plan: free
